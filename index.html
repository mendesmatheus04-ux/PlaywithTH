<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>TH VORTEX</title>
</head>

<body>

    <header>
        <h1>TH <span>VORTEX</span></h1>
    </header>

    <main>
        <!-- GHOST OF TSUSHIMA (Efeito de Ventos e Folhas) -->
        <section class="game-section tsushima-section">
            <div class="bg-effect wind-effect"></div>
            <h2>Ghost of Tsushima</h2>
            <iframe width="1225" height="689" src="https://www.youtube.com/embed/pNupvPybpgE"
                title="The Best Cutscene in Ghost of Tsushima" frameborder="0" allowfullscreen></iframe>
            <iframe width="1225" height="689" src="https://www.youtube.com/embed/3cFNNNgJsEI"
                title="Ghost of Yotei Cutscene" frameborder="0" allowfullscreen></iframe>
            <iframe width="1225" height="689" src="https://www.youtube.com/embed/z14No7a2ipw"
                title="Ghost of Tsushima intro" frameborder="0" allowfullscreen></iframe>
        </section>

        <!-- RED DEAD REDEMPTION 2 (Efeito de Feno Passando) -->
        <section class="game-section rdr2-section">
            <div class="tumbleweed"></div>
            <h2>Red Dead Redemption 2</h2>
            <iframe width="1225" height="689" src="https://www.youtube.com/embed/9FrGTxWQpTM"
                title="RDR2 Best Scenes" frameborder="0" allowfullscreen></iframe>
            <iframe width="1225" height="689" src="https://www.youtube.com/embed/s-6uSAf5U88"
                title="Arthur Morgan Chapter 6" frameborder="0" allowfullscreen></iframe>
            <iframe width="1225" height="689" src="https://www.youtube.com/embed/IDeH_StfAmM"
                title="Arthur Morgan Best Scenes" frameborder="0" allowfullscreen></iframe>
        </section>

        <!-- GTA V (Efeito de Flashes Urbanos/Linhas de Ação) -->
        <section class="game-section gtav-section">
            <div class="bullet-trail"></div>
            <div class="bullet-trail delay"></div>
            <h2>Grand Theft Auto V</h2>
            <iframe width="1225" height="689" src="https://www.youtube.com/embed/8i7SXopVacw"
                title="GTA V Intro Theme" frameborder="0" allowfullscreen></iframe>
            <iframe width="1225" height="689" src="https://www.youtube.com/embed/KzKvPrIPVbE"
                title="GTA V Soundtrack" frameborder="0" allowfullscreen></iframe>
            <iframe width="1225" height="689" src="https://www.youtube.com/embed/QkkoHAzjnUs"
                title="GTA V Trailer" frameborder="0" allowfullscreen></iframe>
        </section>
    </main>

    <footer>
        <p>Desenvolvido com 💜 por <strong>TH VORTEX</strong> &copy; 2026</p>
    </footer>

</body>

</html>
